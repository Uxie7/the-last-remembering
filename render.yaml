services:
  # FastAPI Backend Service
  - type: web
    name: the-last-remembering-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: CORS_ORIGINS
        value: "*"

  # Next.js Frontend Service
  - type: web
    name: the-last-remembering-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: the-last-remembering-api
          property: host

