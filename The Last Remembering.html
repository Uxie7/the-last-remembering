<style>

.t1{width:44%;border-radius:140px 140px 0 0}.t2{width:72%}.t3{width:100%}@media(max-width:760px){.tier{width:100%!important}.t1{border-radius:80px 80px 0 0}}

.dc{opacity:.95;flex:none}

.lbl{font-weight:600;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);margin:20px 0 8px}
.cols{display:grid;gap:44px;grid-template-columns:320px 1fr;align-items:start}@media(max-width:820px){.cols{grid-template-columns:1fr}}
label{display:block;font-weight:600;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);margin:22px 0 6px}
input,select,textarea{width:100%;padding:12px 2px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--ink);font:inherit}
select option{background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}textarea{min-height:150px;resize:vertical;border:1px solid var(--line);padding:14px}
.msg{padding:20px 26px;margin-top:20px;background:var(--card);border-left:3px solid var(--gold);max-width:90%}.msg.you{margin-left:auto;background:transparent;border-left:0;border-right:3px solid var(--mag);text-align:right;color:var(--mut)}
.cite{font-weight:600;font-size:.72rem;letter-spacing:.14em;color:var(--teal);margin-top:12px;cursor:pointer}
.paper{max-width:600px;margin:0 auto;background:#fdf6e6;color:#24103f;padding:0 48px 52px;text-align:center;box-shadow:0 24px 50px -24px rgba(40,10,70,.5);overflow:hidden;position:relative;outline:1px solid #c9a15a;outline-offset:-12px}
.paper .pp{position:relative;display:block;margin:0 -48px 10px;width:calc(100% + 96px)}
footer{padding:54px 0 44px;text-align:center;color:var(--mut);font-size:.82rem;border-top:1px solid var(--line)}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#ffb02e;color:#1d0b33;padding:13px 26px;font-weight:600;font-size:.85rem;display:none;z-index:20}
@media print{nav,footer,.noprint,.scene{display:none}body{background:#fff}.paper{box-shadow:none}}
.btn,.card,.chip,.paper,.panel,.toast,textarea{border-radius:6px}.cards .card{border-radius:0}.note,.msg{border-radius:4px}.tier.t2,.tier.t3{border-radius:8px 8px 0 0}.chip{border-radius:5px}

<script>
let mgs="";[[14,30,17,8.5,"#f59e0b"],[11,22,14,7,"#ff7a1a"],[8,14,10,5.5,"#ffc233"]].forEach(([n,d,ry,rx,f])=>{for(let i=0;i<n;i++)mgs+=`<ellipse cx="50" cy="${50-d}" rx="${rx}" ry="${ry}" fill="${f}" stroke="#7a3300" stroke-opacity=".25" transform="rotate(${i*360/n+(n==11?9:0)} 50 50)"/>`});mgs+='<circle cx="50" cy="50" r="5" fill="#b45309"/>';

{id:"lupita",c:"#e8307f",name:"Abuela Lupita",rel:"Grandmother",glow:92,last:2,foods:["Mole negro","Tamales de rajas"],songs:["Cielito Lindo"],say:["A full belly makes a happy heart"],stories:[
{t:"Sunday mole",d:"March 2026",x:"Every Sunday Abuela Lupita ground the chiles for mole negro by hand and hummed Cielito Lindo while she stirred. She served it with tamales de rajas and always said a full belly makes a happy heart."},
{t:"The bus to Oaxaca",d:"January 2026",x:"Abuela once missed the last bus to Oaxaca and spent the night at the station playing lotería, a Mexican bingo game, with strangers. She won every round and never told anyone her secret."}]},
{id:"joaquin",c:"#12b5a5",name:"Abuelo Joaquín",rel:"Grandfather",glow:61,last:19,foods:["Café de olla","Pan de muerto"],songs:["Sabor a Mí"],say:["Take it slow, son"],stories:[
{t:"Songs in the truck",d:"February 2026",x:"On long drives Abuelo sang Sabor a Mí slightly off key in his blue pickup and lowered the radio to do it. A thermos of café de olla always rode between the seats."},
{t:"The guitar on the porch",d:"December 2025",x:"Every evening he sat on the porch with his old guitar and a plate of pan de muerto. Whenever anyone rushed him he said take it slow, son."}]},
{id:"chema",c:"#7c3aed",name:"Tío Chema",rel:"Uncle",glow:34,last:48,foods:["Champurrado"],songs:["Bésame Mucho"],say:["If you do something, you do it well"],stories:[
{t:"The carpentry shop",d:"October 2025",x:"Tío Chema’s workshop smelled of cedar and champurrado. He played Bésame Mucho on a cracked radio and taught me that if you do something, you do it well."}]},
{id:"xochitl",c:"#ff9f1c",name:"Prima Xóchitl",rel:"Cousin",glow:12,last:96,foods:[],songs:[],say:[],stories:[]}];
const known=["mole","tamales","pan de muerto","champurrado","atole","café","churros","pozole","elote"];
let cur="lupita",tt,n=0;const $=s=>document.querySelector(s);
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(tt);tt=setTimeout(()=>t.style.display="none",2400)};
const status=g=>g>75?"Burning bright":g>45?"Glowing":g>20?"Fading":"Nearly dark";
const u=(id,w,h)=>`<use href="#${id}" width="${w}" height="${h||w}"/>`;
const papel=h=>{const c=["#e8307f","#ff9f1c","#12b5a5","#ffd23f","#7c3aed","#ff6b6b"];let s="";for(let i=0;i<24;i++){const y=Math.sin(Math.PI*i/24)*8;s+=`<g transform="translate(${i*60+4} ${y})"><path d="M0 8h52v44l-13 10-13-10-13 10-13-10z" fill="${c[i%6]}"/><path d="M26 18l9 10-9 10-9-10z" fill="#150726" opacity=".45"/><circle cx="10" cy="14" r="3" fill="#150726" opacity=".45"/><circle cx="42" cy="14" r="3" fill="#150726" opacity=".45"/><circle cx="26" cy="47" r="3" fill="#150726" opacity=".45"/></g>`}return `<svg class="pp" viewBox="0 0 1440 80" preserveAspectRatio="xMidYMin slice" height="${h}"><path d="M0 8Q720 24 1440 8" stroke="#ffcf5a" fill="none" stroke-width="2"/>${s}</svg>`};
const garland=cl=>{let s="";for(let i=0;i<30;i++){const z=66+(i*7%5)*9;s+=`<use href="#mg" x="${i*48-20}" y="${36+(i*5%4)*10}" width="${z}" height="${z}"/>`}return `<svg class="gar ${cl||""}" viewBox="0 0 1400 150" preserveAspectRatio="xMidYMax slice">${s}</svg>`};
const candle=g=>`<svg class="cd" viewBox="0 0 24 70"><circle cx="12" cy="16" r="${10+g/4}" fill="url(#gl)" opacity="${.4+g/160}"/><path class="fm" d="M12 4c6 7 6 12 0 17-6-5-6-10 0-17z" fill="#ffc94d" opacity="${.45+g/180}"/><path d="M12 11c3 4 3 7 0 9-3-2-3-5 0-9z" fill="#fff"/><rect x="7" y="22" width="10" height="46" rx="3" fill="#fff3dc"/></svg>`;

const w2=[[-4,62],[2,34],[22,10],[52,-4],[82,-4],[108,10],[128,34],[134,62]].map(([x,y])=>`<use href="#mg" x="${x}" y="${y}" width="28" height="28"/>`).join("");
return `<svg viewBox="-10 -14 160 214" width="${w}" style="overflow:visible"><defs><clipPath id="${k}"><path d="${A}"/></clipPath><linearGradient id="g${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.c}"/><stop offset="1" stop-color="#2a1048"/></linearGradient></defs><path d="${A}" fill="url(#g${k})"/>${b}<path d="${A}" fill="none" stroke="#ffcf5a" stroke-width="5"/>${w2}</svg>`};

const V={
home(){return `<div class="scene big">${papel(90)}<svg class="sk" style="left:5%;bottom:60px;transform:rotate(-8deg)" width="150" height="195">${u("sk",150,195)}</svg><svg class="sk" style="right:5%;bottom:60px;transform:rotate(8deg)" width="150" height="195">${u("sk",150,195)}</svg><svg class="bf" style="left:22%;top:230px" width="64" height="43">${u("bf",64,43)}</svg><svg class="bf" style="right:20%;top:190px;animation-delay:-2s" width="52" height="35">${u("bf",52,35)}</svg><div class="wrap"><div class="eyebrow">Inspired by the Day of the Dead</div><h1>Keep their light<br><em>burning.</em></h1><p>A private place to keep the stories of the people you love, their voices, recipes, songs and sayings, on an ofrenda that glows brighter each time you remember them.</p><div class="row c"><a class="btn" href="#ofrenda">Visit the ofrenda</a><a class="btn ghost" href="#add">Add a memory</a></div></div>${garland()}</div>
<section><div class="wrap two"><div class="panel"><svg width="230" height="300">${u("sk",230,300)}</svg><svg style="position:absolute;left:14px;bottom:10px" width="80" height="80">${u("mg",80)}</svg><svg style="position:absolute;right:10px;top:10px" width="64" height="64">${u("mg",64)}</svg><svg style="position:absolute;right:30px;bottom:16px" width="70" height="46">${u("bf",70,46)}</svg></div><div><div class="eyebrow">The tradition</div><h2>An altar made of love</h2><p style="color:var(--mut)">Each year on November 1 and 2, families welcome back loved ones with an ofrenda: marigolds to guide them, candles to light the way, their favorite foods, and photographs. As long as someone remembers them, they are never truly gone.</p><p style="color:var(--mut)">The Last Remembering brings that idea home all year, privately and offline.</p></div></div></section>
<section class="alt"><div class="wrap"><div class="eyebrow">How it works</div><h2>Four gentle steps</h2><div class="cards">${[["Record","Speak or write a story. Whisper transcribes it on your own device.","#e8307f"],["Confirm","A local Gemma model suggests foods, songs and sayings. You approve each one.","#12b5a5"],["Keep the light","Each candle glows with the stories you add, and dims if someone goes unvisited.","#ff9f1c"],["Ask","Answers come only from what you saved, always with a link to the source.","#7c3aed"]].map((s,i)=>`<div class="card"><div class="num">${i+1}</div><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join("")}</div></div></section>
<section><div class="wrap"><div class="eyebrow">Why open models</div><h2>A memory should outlive a service</h2><div class="cards">${[["Private","Voices and photos of your family never reach a server you do not control."],["Offline","Works at a family gathering with no signal at all."],["Durable","Weights, database and files are yours. No shutdown can erase them."],["Swappable","Change the model any time and compare how it answers."]].map((s,i)=>`<div class="card"><svg width="46" height="46">${u(["mg","bf","sk","bd"][i],46)}</svg><h3 style="margin-top:10px">${s[0]}</h3><p>${s[1]}</p></div>`).join("")}</div></div></section>
<div class="scene" style="padding:90px 0 0"><div class="wrap"><h2>Begin with one person.</h2><p style="margin-bottom:26px">I did not grow up with this tradition. I am learning it, and this is how I honor the people in my own life.</p><a class="btn" href="#ofrenda">Start remembering</a></div>${garland("fl")}</div>`},
ofrenda(){return mini("Memorial altar","Your ofrenda","Each candle shows how recently and how richly someone has been remembered.")+`<div class="scene" style="padding-top:50px"><div class="altar"><div class="tier t1">${papel(46)}${dc("sk",74)}${c2(P[0])}${dc("sk",74)}</div><div class="tier t2">${papel(46)}${dc("bd",86)}${c2(P[1])}${c2(P[2])}${dc("bd",86)}</div><div class="tier t3">${papel(46)}${dc("mg",84)}${c2(P[3])}${dc("bd",86)}${dc("mg",84)}</div></div>${garland("fl")}</div><div class="wrap" style="padding:40px 24px 70px"><div class="card row" style="justify-content:space-between"><span><b style="font-family:Cormorant Garamond,serif;font-size:1.6rem">${P[3].name}</b> <span style="color:var(--mut)">has not been visited in ${P[3].last} days, and her candle is nearly out.</span></span><a class="btn" href="#add">Add a story</a></div></div>`},
person(id){const p=P.find(x=>x.id==id)||P[0];cur=p.id;return mini(p.rel+" · "+status(p.glow),p.name,p.stories.length+" "+(p.stories.length==1?"story":"stories")+" kept")+`<div class="wrap cols" style="padding:56px 24px 80px"><div><div class="card" style="text-align:center;padding-top:44px">${portrait(p,170)}<div style="margin-top:18px"><label class="btn ghost noprint" style="margin:0;color:var(--ink);display:inline-block;padding:11px 22px;font-size:.88rem">Add a photo<input type="file" accept="image/*" id="ph" hidden></label></div></div><div class="card" style="margin-top:22px"><div class="lbl" style="margin-top:0">Foods</div>${chips(p.foods,"#ff9f1c")}<div class="lbl">Songs</div>${chips(p.songs,"#e8307f")}<div class="lbl">Sayings</div>${chips(p.say,"#12b5a5")}</div><div class="row" style="margin-top:22px"><a class="btn" href="#add">Add memory</a><a class="btn ghost" href="#ask">Ask</a></div></div><div><h2>Stories</h2>${p.stories.length?p.stories.map(s=>`<div class="note"><svg class="nf" width="46" height="46">${u("mg",46)}</svg><h3 style="margin:0">${s.t}</h3><div style="font-size:.85rem;color:var(--gold);font-weight:700">${s.d}</div><p>${s.x}</p></div>`).join(""):`<div class="note"><p>No stories yet. A single small memory is enough to light the candle.</p></div>`}</div></div>`},
add(){return mini("New memory","Add a memory","Record or write a story. Everything is processed on your own device.")+`<div class="wrap cols" style="padding:56px 24px 80px;grid-template-columns:1.4fr 1fr"><div class="card"><label style="margin-top:0">Who is this about?</label><select id="who">${opts(cur)}</select><label>Title</label><input id="ttl" placeholder="Sunday mole"><label>Story</label><textarea id="txt" placeholder="Write it here, or press Record…"></textarea><div class="row" style="margin-top:24px"><button class="btn ghost" id="rec" style="color:var(--ink)">Record (demo)</button><button class="btn ghost" id="ext" style="color:var(--ink)">Extract facts</button><button class="btn" id="sv">Save memory</button></div></div><div class="card"><h3>Proposed facts</h3><p>Nothing is saved until you approve it. A demo story is prefilled: press Extract facts, then Save memory.</p><div id="facts" style="margin-top:14px"></div><div class="lbl" style="margin-top:26px">Local pipeline</div><p>Whisper → Gemma → your SQLite file</p></div></div>`},
ask(){return mini("Search","Ask a memory","Answers come only from stories you have saved. Nothing is invented.")+`<div class="wrap" style="max-width:800px;padding:56px 24px 80px"><div class="card" style="padding:18px"><div class="row"><select id="aw" style="width:190px"><option value="all">Everyone</option>${opts("")}</select><input id="q" placeholder="What did Abuelo sing in the truck?" style="flex:1;min-width:200px"><button class="btn" id="go">Ask</button></div></div><div class="row" style="margin-top:16px"><span style="color:var(--mut)">Try:</span>${["What did Abuelo sing in the truck?","What did Abuela cook on Sundays?","What was Tío Chema’s workshop like?","What was Abuela’s favorite color?"].map(q=>`<button class="btn ghost qc" style="color:var(--ink);padding:8px 16px;font-size:.82rem">${q}</button>`).join("")}</div><div id="chat"></div></div>`},
export(){const p=P.find(x=>x.id==cur)||P[0];return mini("Keepsake","Remembrance page","A printable page to place beside the candle.")+`<div class="wrap" style="padding:56px 24px 80px"><div class="row noprint c" style="margin-bottom:28px"><select id="ew" style="width:240px">${opts(p.id)}</select><button class="btn" onclick="print()">Print</button></div><div class="paper">${papel(60)}<div style="padding-top:30px">${portrait(p,130)}</div><h2 style="margin:18px 0 0">${p.name}</h2><div style="color:#6d5788;margin-bottom:20px">${p.rel}</div><p style="font:italic 500 1.7rem/1.4 Cormorant Garamond,serif">${p.stories[0]?p.stories[0].x:"Their story is still waiting to be told."}</p><p>${[...p.foods,...p.songs].map(f=>`<span class="chip" style="border:1px solid #c9a15a">${f}</span>`).join("")}</p><div style="color:#6d5788;font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:.7rem;margin-top:26px">Always in our memory</div></div></div>`}};
function route(){const h=(location.hash||"#home").slice(1);const [r,id]=h.split("-");const k=V[r]?r:"home";$("#app").innerHTML=V[k](id);document.querySelectorAll("nav .l").forEach(a=>a.classList.toggle("on",a.dataset.r==(k=="person"?"ofrenda":k)));scrollTo(0,0);bind(k)}
function bind(k){
if(k=="person")$("#ph").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader;r.onload=()=>{P.find(x=>x.id==cur).img=r.result;route();toast("Photo added. It stays on this device.")};r.readAsDataURL(f)};
if(k=="add"){let f={};$("#who").value="xochitl";$("#ttl").value="Christmas Eve tamales";const D="Xóchitl and I spent every Christmas Eve folding tamales with Abuela Lupita. We sang Cielito Lindo, and she would say a full belly makes a happy heart.";$("#txt").value=D;
$("#rec").onclick=()=>{$("#txt").value=D;toast("Transcribed locally with Whisper (demo)")};
$("#ext").onclick=()=>{const t=$("#txt").value.toLowerCase(),sk={"full belly":"A full belly makes a happy heart","take it slow":"Take it slow, son","do it well":"If you do something, you do it well"};f={foods:known.filter(w=>t.includes(w)).map(w=>w[0].toUpperCase()+w.slice(1)),songs:["cielito lindo","sabor a mí","bésame mucho"].filter(w=>t.includes(w)).map(w=>w.replace(/(^|\s)\S/g,c=>c.toUpperCase())),say:Object.keys(sk).filter(w=>t.includes(w)).map(w=>sk[w])};const g=(l,a,c)=>a.length?`<div class="lbl">${l}</div>`+chips(a.map(x=>x+" ✓"),c):"";$("#facts").innerHTML=g("Foods",f.foods,"#ff9f1c")+g("Songs",f.songs,"#e8307f")+g("Sayings",f.say,"#12b5a5")||"<p>No facts found. Try mentioning a dish.</p>"};
$("#sv").onclick=()=>{const p=P.find(x=>x.id==$("#who").value),x=$("#txt").value.trim();if(!x)return toast("Write or record a story first");p.stories.unshift({t:$("#ttl").value||"Untitled",d:"Today",x});["foods","songs","say"].forEach(k=>(f[k]||[]).forEach(a=>{if(!p[k].includes(a))p[k].push(a)}));p.glow=Math.min(100,p.glow+25);p.last=0;toast("Saved. The candle burns brighter.");location.hash="person-"+p.id}}
if(k=="ask"){const ch=$("#chat"),stop="what did was the his her and with that for from about like".split(" "),syn={sing:["sang","song"],cook:["served","ground","mole"]};
$("#go").onclick=()=>{const q=$("#q").value.trim();if(!q)return;const ws=q.toLowerCase().replace(/[^a-záéíóúñ ]/g,"").split(" ").filter(w=>w.length>2&&!stop.includes(w)).map(w=>w.length>4&&w.endsWith("s")?w.slice(0,-1):w),w=$("#aw").value;let b=null,sc=0;P.filter(p=>w=="all"||p.id==w).forEach(p=>p.stories.forEach(s=>{const c=(s.t+" "+s.x).toLowerCase(),n=ws.filter(z=>(syn[z]||[z]).some(y=>c.includes(y))).length;if(!n)return;const v=n+(ws.some(z=>p.name.toLowerCase().includes(z))?.5:0);if(v>sc){sc=v;b={p,s}}}));
ch.innerHTML+=`<div class="msg you">${q.replace(/</g,"&lt;")}</div>`+(b?`<div class="msg">${b.s.x}<div class="cite" onclick="location.hash='person-${b.p.id}'">SOURCE · ${b.s.t} · ${b.p.name} →</div></div>`:`<div class="msg">I don’t have a memory of that yet. <a href="#add" style="color:var(--teal);font-weight:700">Add one →</a></div>`);$("#q").value=""};
$("#q").onkeydown=e=>e.key=="Enter"&&$("#go").click();document.querySelectorAll(".qc").forEach(c=>c.onclick=()=>{$("#q").value=c.textContent;$("#go").click()});$("#q").value="What did Abuelo sing in the truck?";$("#go").click()}
if(k=="export")$("#ew").onchange=e=>{cur=e.target.value;route()}}
addEventListener("hashchange",route);route();
</script></body></html>
